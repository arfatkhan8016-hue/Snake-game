name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore SnakeGameAndroid/SnakeGameAndroid.csproj

      - name: Build Android APK (Release)
        run: |
          dotnet publish SnakeGameAndroid/SnakeGameAndroid.csproj \
            -c Release \
            -f net8.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -o ./publish

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find ./publish -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "✅ Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
